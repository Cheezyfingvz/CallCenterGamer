services:
  - type: web
    name: callcentergamer
    runtime: python
    plan: free
    region: oregon
    buildCommand: bash build.sh
    startCommand: gunicorn CallCenterGamer.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com
